name: Frostline quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check tests/smoke.test.cjs
          node --check tests/layout.test.cjs
      - name: Test onboarding, scores and basic gameplay
        run: node --test tests/smoke.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify compact desktop and mobile menu fit
        run: node --test tests/layout.test.cjs
